name: Gerar APK Seralle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: apk-seralle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerar-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependencias rigorosas (npm ci)
        run: npm ci

      - name: Validar TypeScript (Lint)
        run: npm run lint

      - name: Executar testes unitarios
        run: npm test

      - name: Gerar aplicacao web (Build)
        run: npm run build

      - name: Sincronizar arquivos Android (Capacitor Sync)
        run: |
          [ -d "android" ] || npx cap add android
          npx cap sync android

      - name: Configurar Keystore Fixa para Assinatura Determinística
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decodificando keystore informada nos secrets do GitHub..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          elif [ -f "android/app/release.keystore" ]; then
            echo "Keystore fixa localizada no repositorio."
          else
            echo "Keystore personalizada não fornecida em secrets. Mantendo compilação debug consistente."
          fi

      - name: Compilar APK instalavel
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verificar SHA-1 do APK Gerado
        working-directory: android
        run: |
          echo "=== SHA-1 da Assinatura do APK Gerado ==="
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            keytool -printcert -jarfile "$APK_PATH" | grep -i "SHA1:" || true
          fi

      - name: Publicar APK Artefato
        uses: actions/upload-artifact@v4
        with:
          name: seralle-vendas-v1.1.0-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
